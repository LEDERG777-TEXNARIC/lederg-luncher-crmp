name: Windows launcher
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep canonical source line endings
        run: git config core.autocrlf false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          architecture: "x64"
      - run: python -m pip install -r requirements.txt
      - run: python tools/update_runtime_manifest.py
      - run: git diff --exit-code -- runtime-manifest.json
      - run: python -m unittest discover -v
      - run: pyinstaller --clean --noconfirm "LEDERG CRMP.spec"
      - uses: actions/upload-artifact@v4
        with:
          name: LEDERG-CRMP-Launcher-Windows-x64
          path: dist/LEDERG CRMP.exe
          if-no-files-found: error
